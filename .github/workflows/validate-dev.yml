name: PR Validation (Gate 1) # Friendly name shown on GitHub.

on: # WHEN it runs (the trigger):
  pull_request:
    branches: [msa_dev] # any PR targeting 'dev'.

jobs:
  validate:
    runs-on: ubuntu-latest # rent a fresh Linux computer from GitHub.
    steps:
      - uses: actions/checkout@v4 # 1. copy the PR's code onto it.
        with:
          fetch-depth: 0 # needed for the diff-coverage check against the base branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Required for modern sf CLI versions

      - run: npm install -g @salesforce/cli # 2. install the 'sf' tool.

      # Authenticate to the target Sandbox using JWT
      - name: Authenticate to Salesforce Sandbox (JWT)
        shell: bash
        run: |
          set -euo pipefail

          # fail fast if required secrets are missing
          if [ -z "${{ secrets.JWT_SERVER_KEY }}" ]; then
            echo "ERROR: secrets.JWT_SERVER_KEY is not set" >&2
            exit 1
          fi
          if [ -z "${{ secrets.DEV_USERNAME }}" ]; then
            echo "ERROR: secrets.DEV_USERNAME is not set" >&2
            exit 1
          fi
          if [ -z "${{ secrets.DEV_CONSUMER_KEY }}" ]; then
            echo "ERROR: secrets.DEV_CONSUMER_KEY is not set" >&2
            exit 1
          fi

          # write private key to file with strict permissions
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
          chmod 600 server.key

          # prefer secret DEV_INSTANCE_URL (if set), otherwise fall back to workflow var
          if [ -n "${{ secrets.DEV_INSTANCE_URL }}" ]; then
            INSTANCE_URL_VALUE="${{ secrets.DEV_INSTANCE_URL }}"
          else
            INSTANCE_URL_VALUE="${{ vars.DEV_INSTANCE_URL }}"
          fi

          sf org login jwt \
            --username "${{ secrets.DEV_USERNAME }}" \
            --jwt-key-file server.key \
            --client-id "${{ secrets.DEV_CONSUMER_KEY }}" \
            --instance-url "${INSTANCE_URL_VALUE}" \
            --set-default --alias dev
        # 3. log in using the SECRET stored in GitHub settings (no password in the file).
      - run: sf project deploy validate --source-dir force-app --test-level RunLocalTests --wait 30
        # 4. the gate: check-only deploy + run all Apex tests. Fails => PR red => merge blocked.

      - name: Run Apex tests with coverage (for the coverage gate)
        run: |
          sf apex run test \
            --target-org dev \
            --test-level RunLocalTests \
            --code-coverage \
            --wait 30 \
            --json > test-result.json

      - name: Enforce Kloudserv coverage standard
        run: node scripts/ci/check-coverage.mjs --test-result test-result.json --base-ref "origin/${{ github.base_ref }}"
